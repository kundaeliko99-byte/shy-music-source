<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your SHY sign-in code</title>
  </head>
  <body style="margin:0;background:#07060d;color:#f4f1ff;font-family:Inter,Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#07060d;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;border:1px solid #29243a;border-radius:24px;background:#11101a;padding:28px;">
            <tr>
              <td>
                <div style="font-size:12px;font-weight:800;letter-spacing:0.22em;color:#bda2ff;text-transform:uppercase;">SHY</div>
                <h1 style="margin:18px 0 8px;font-size:26px;line-height:1.2;color:#ffffff;">Your SHY code</h1>
                <p style="margin:0 0 22px;color:#b8b0cc;font-size:15px;line-height:1.6;">
                  Enter this 6-digit code in SHY to continue.
                </p>
                <div style="margin:24px 0;padding:18px 20px;border-radius:18px;background:#07060d;border:1px solid #8b47f5;text-align:center;">
                  <div style="font-size:36px;line-height:1.1;font-weight:900;letter-spacing:0.24em;color:#ffffff;">{{ .Token }}</div>
                </div>
                <p style="margin:0;color:#8f86a6;font-size:13px;line-height:1.6;">
                  This code expires soon. If you did not request it, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
