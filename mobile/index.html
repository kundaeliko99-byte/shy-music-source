<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A0A0F" />
    <title>SHY</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0a0f;
        color: #f1f0ff;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(320px, calc(100vw - 48px));
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 14px;
        object-fit: cover;
        filter: drop-shadow(0 0 18px rgba(167, 139, 250, 0.35));
      }
      h1 {
        margin: 18px 0 8px;
        font-size: 18px;
      }
      p {
        margin: 0;
        color: #a9a4bd;
        font-size: 13px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="assets/icon-192.png" alt="SHY" />
      <h1>Opening SHY</h1>
      <p>Connect to the internet to load the SHY songwriter marketplace.</p>
    </main>
  </body>
</html>
